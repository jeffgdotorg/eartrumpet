info:
  name: TTS - basic test
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:8080/v1/tts
  body:
    type: json
    data: |-
      {
        "text": "This is a test of the Eartrumpet TTS service",
        "voice": "F1",
        "lang": "en",
        "response_format": "ogg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
