    data: '<img src="https://www.adventuresinoss.com/images/ZHA-flash.png" alt="Featured image of post Sonoff Zigbee Bridge with Home Assistant" /><p>Back in November of 2024, my father (who is now 86) moved in with us. We are lucky enough to have a house with a basement apartment, and after my mother died we were able to take him in.</p> <p>As an older person he has certain needs, so I&rsquo;ve been looking for technology that could help out with taking care of him. At first I just wanted to get a couple of low cost buttons that he could press to send me a notification. I could put one next to his bed, next to his chair, next to his desk and in the bathroom, etc., and if he needed me he could just hit the button and I would get a notice.</p> <p>This search led me to <a class="link" href="https://sonoff.tech/en-us" target="_blank" rel="noopener" >Sonoff</a> and their <a class="link" href="https://en.wikipedia.org/wiki/Zigbee" target="_blank" rel="noopener" >Zigbee</a>-enabled devices. These are low cost, low power devices that can do a number of simple tasks (such as implement a button). They integrate with <a class="link" href="https://en.wikipedia.org/wiki/Home_Assistant" target="_blank" rel="noopener" >Home Assistant</a> (HA), which is a platform I am starting to explore as an alternative to Apple&rsquo;s <a class="link" href="https://en.wikipedia.org/wiki/Apple_Home" target="_blank" rel="noopener" >HomeKit</a> ecosystem.</p> <blockquote> <p><strong>TL;DR;</strong> If you are willing to open up the Sonoff Zigbee Bridge Pro and flash custom firmware, it is pretty easy to integrate Zigbee devices with Home Assistant. Just use the Zigbee Home Automation integration and avoid MQTT.</p> </blockquote> <p>They had the buttons I needed, and while I was window shopping I picked up a <a class="link" href="https://amzn.to/43lVdPE" target="_blank" rel="noopener" >temperature/humidity sensor</a> and a couple of <a class="link" href="https://amzn.to/49M7q3J" target="_blank" rel="noopener" >human presence sensors</a>. The temperature sensor was just for fun, but the human presence sensors would let me know where he was in the apartment without the intrusiveness of cameras.</p> <p>To make this all work I needed a bridge device, so I bought the Zigbee Bridge Pro.</p> <p><img alt="Sonoff Zigbee Bridge Pro" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-sonoff-bridge.png"></p> <p>Now Sonoff has its own cloud-based device management system based around an app called <a class="link" href="https://sonoff.tech/en-us/pages/ewelink" target="_blank" rel="noopener" >eWeLink</a>. I installed it and confirmed that the buttons would do exactly what I wanted: in case of a button press, I could get an alert.</p> <p>But being an open source nerd I didn&rsquo;t want to rely on a third party server, so I went exploring to find out what it would take to integrate this new hardware with Home Assistant. The articles I read all started off with flashing a new, open source firmware, called <a class="link" href="https://github.com/arendst/Tasmota" target="_blank" rel="noopener" >Tasmota</a>, on the Zigbee Bridge.</p> <p>Note: since I spent several days on this process I did come across a <a class="link" href="https://community.home-assistant.io/t/the-new-ewelink-smart-home-add-on-is-now-available/974237" target="_blank" rel="noopener" >Home Assistant Add-on</a> that will integrate HA directly with eWeLink. So if you are cool with using a remote server that could be an easier way of integrating Sonoff devices with HA.</p> <p>In order to flash new firmware, you will need to open up the box and connect a TTL adapter directly to the motherboard. You will not need to solder anything and you only have to do this once, but it is a little more involved than just connecting the device to a computer.</p> <p>While I had all of the needed hardware on-hand, I didn&rsquo;t really have time to work on this, but since my <a class="link" href="https://www.adventuresinoss.com/aws-four-years/" >work situation</a> has changed lately, I was able to devote a couple of days to it. I spent most of that time down a rabbit hole that I could have avoided entirely (sigh).</p> <h2 id="flashing-tasmota-to-the-bridge">Flashing Tasmota to the Bridge </h2><p>In order to flash the firmware, you will need the following hardware:</p> <ul> <li>Sonoff <a class="link" href="https://amzn.to/4ec823N" target="_blank" rel="noopener" >Zigbee Pro Bridge</a> (&rsquo;natch)</li> <li>USB to TTL <a class="link" href="https://amzn.to/4dY6JH0" target="_blank" rel="noopener" >Serial Adapter</a></li> <li><a class="link" href="https://amzn.to/43lCP9B" target="_blank" rel="noopener" >Jumper Wires</a></li> <li>Small prying tool (a small screwdriver will work)</li> <li>Phillips head screwdriver</li> </ul> <p>As for software, you&rsquo;ll need the latest <code>tasmota32-zbbrdgpro.factory.bin</code> image <a class="link" href="https://github.com/tasmota/install/tree/firmware/firmware/release" target="_blank" rel="noopener" >from GitHub</a>. You will also need the <a class="link" href="https://github.com/Jason2866/ESP_Flasher" target="_blank" rel="noopener" >ESP_Flasher tool</a>. You can use the <a class="link" href="https://packages.debian.org/sid/all/esptool/download" target="_blank" rel="noopener" >esptool</a> package under Linux as well, and I can highly recommend <a class="link" href="https://www.stephengrier.com/flashing-tasmota-on-a-sonoff-zigbee-bridge/" target="_blank" rel="noopener" >this post</a> by <a class="link" href="https://www.stephengrier.com" target="_blank" rel="noopener" >Stephen Grier</a> which I referred to a lot during this process if you want to go that route.</p> <p>With that in hand, let&rsquo;s get going.</p> <p><img alt="Sonoff Removing Rubber Pads" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-sonoff-feet.png"></p> <p>Start by prying off the little white rubber pads on the bottom of the Bridge.</p> <p><img alt="Sonoff Exposed Screws" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-sonoff-screws.png"></p> <p>This will expose four Phillips head screws. They are &ldquo;captive&rdquo; in that they won&rsquo;t come out of the plastic back plate, so just loosen them until the plate separates from the rest of the case.</p> <p><img alt="Sonoff lift out circuit board" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-sonoff-remove.png"></p> <p>You can then remove the green circuitboard. Gently pry up on the side away from the USB port and it should come right out.</p> <p><img alt="Sonoff Circuit Board" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-sonoff-board.png"></p> <p>If you look on the component side, on the part of the board opposite the USB power connector you&rsquo;ll see five little holes. You are going to be connecting jumper wires from the TTL adapter into those five holes.</p> <p><img alt="Sonoff holes for wire pins" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-sonoff-pins.png"></p> <p>Before doing anything, look at your TTL adapter and see if there is a jumper that selects between 5V and 3.3V. You want to set it to 3.3V. This adapter will be powering the Bridge while you are flashing the hardware.</p> <p>My TTL adapter came with six pins. It was a little hard to see the labels, but I needed four of them: TX, RX, VCC and GND.</p> <p><img alt="TTL adapter pin-out" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-TTL-pinout.png"></p> <p>With the voltage on the adapter set to 3.3V, connect the VCC pin to 3V3, the TX pin to RX, the RX pin to TX, and the GND to GND. In order to flash the firmware, the GPI00 has to be tied to GND when you apply power, so I just wedged in another wire to my GND connector on the adapter and plugged it in to the GPI00 hole (I started with this older <a class="link" href="https://youtu.be/dC1AEyFhmnc?si=FbtJBscCiJhn9T1-&amp;t=399" target="_blank" rel="noopener" >YouTube video</a> that shows you how to do it).</p> <p><img alt="TTL adapter with wires connected" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-TTL.png"></p> <p>This is the tricky part, because the pins will want to come out. I just used my finger to hold them in place.</p> <p>When you think you have everything ready, but before you connect the TTL adapter to your computer, launch the ESP_Flasher application. There will be a &ldquo;Select Port&rdquo; dropdown. Click on it and note the available ports. When you connect the adapter you&rsquo;ll get a new port and that is the one you want to use. Quit out of the application for now.</p> <p>Connect the adapter to power, and you should see a red light on it as well as a blue light on the Bridge. Launch the ESP_Flasher tool, choose the new port and click on &ldquo;Connect&rdquo;.</p> <p><img alt="ESP Flasher screenshot" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-ESP-flasher.png"></p> <p>If the connection goes through, you are ready to flash. Browse until you find your downloaded <code>tasmota32-zbbrdgpro.factory.bin</code> image, select it, and click on &ldquo;Flash ESP&rdquo;.</p> <p><img alt="TTL connected to Bridge and ready to flash" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-flash.png"></p> <p>If everything goes well you should see messages as the flashing proceeds. It should take a minute or two, and the times I did it, it would hang on 90% for a few seconds (I got worried because the progress indicator moved pretty quickly up until then).</p> <p>When it is complete, disconnect the power to the adapter and remove the wires.</p> <p>If it fails and complains about a communication issue, swap the wires for RX and TX. Remember that the &ldquo;receive&rdquo; port on one device needs to connect to the &ldquo;transmit&rdquo; port on the other, and vice versa.</p> <p>At this point in time you can reassemble the Bridge. Gently place the board back in the enclosure (making sure the USB port fits into the hole) and screw on the back plate. I would not replace the little rubber feet (they are sticky on one side) until you make sure everything is working just in case you have to try again.</p> <h2 id="booting-into-tasmota">Booting into Tasmota </h2><p>If everything has gone smoothly up until this point, the rest is easy. Connect the Bridge to power (you should see a blue light come on briefly), wait a minute or so, and you should see a new wireless SSID that starts with &ldquo;Tasmota&rdquo;.</p> <p>Select that network, and on my iMac it brought up one of those authentication screens that you get when, say, connecting to hotel WiFi. If not, the IP address should be 192.168.4.1.</p> <p><img alt="Connect to WiFi Network screenshot" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-select-network.png"></p> <p>This screen will let you connect the Bridge to your local WiFi network. Once there, choose the network and enter in the password. It should then show you the new IP address for the Bridge. Switch back to your main network.</p> <p>Note that one of the first things I do with any device I add permanently to my network is I assign a static IP address to it. The process differs depending on what router/DCHP server you use, so if you know what I&rsquo;m talking about you should do it, too.</p> <p>Navigate to the new IP address and you should see a screen like this:</p> <p><img alt="Main Tasmota Screen" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-tasmota-menu.png"></p> <p>If you made it to this point you can probably put the little rubber feet back on.</p> <h2 id="what-not-to-do">What Not to Do </h2><p>At the point in time I embarked on two days of messing around trying to get this stupid thing to integrate easily with HA. I sometime joke when it comes to tech that I &ldquo;don&rsquo;t know how the muggles do it&rdquo; as I consider myself somewhat savvy, and I totally messed this up.</p> <p>Everything I read talked about connecting Tasmota to HA via <a class="link" href="https://en.wikipedia.org/wiki/MQTT" target="_blank" rel="noopener" >MQTT</a>. You install an MQTT server on HA, create a user, and point the Tasmota to the server using that username and password.</p> <p>You then have to install a configuration file which will then allow the Tasmota device to discover (pair) with Zigbee devices, and then events from those devices will show up via MQTT.</p> <p>Oh, and you&rsquo;ll see a lot of references on the web to going into the console and running &ldquo;SetOption19 0&rdquo; to make discovery work.</p> <p>The problem: discovery doesn&rsquo;t work.</p> <p>You can look at the MQTT queue and you will see a &ldquo;tele/discovery&rdquo; message for the Sonoff Bridge itself, but never for any of the devices connected to it.</p> <p>Instead, you have to edit the <code>configuration.yaml</code> file in HA and manually add the devices. It&rsquo;s a pain. Here is an example for the temperature/humidity sensor:</p> <pre tabindex="0"><code>mqtt: sensor: - name: &#34;Basement Temperature&#34; unique_id: &#34;Basement_Temp&#34; state_topic: &#34;tele/tasmota_01/Basement_Temp/SENSOR&#34; value_template: &gt; {% if value_json[&#39;ZbReceived&#39;][&#39;0x1B5C&#39;][&#39;Temperature&#39;] &gt; 0 %} {{ (value_json[&#39;ZbReceived&#39;][&#39;0x1B5C&#39;][&#39;Temperature&#39;]|float * 1.8) + 32 }} {% else %} {{ states(entity_id) }} {% endif %} unit_of_measurement: &#34;°F&#34; availability_topic: &#34;tele/tasmota_01/LWT&#34; payload_available: &#34;Online&#34; payload_not_available: &#34;Offline&#34; device_class: &#34;temperature&#34; - name: &#34;Basement Humidity&#34; unique_id: &#34;Basement_Humidity&#34; state_topic: &#34;tele/tasmota_01/Basement_Temp/SENSOR&#34; value_template: &gt; {% if value_json[&#39;ZbReceived&#39;][&#39;0x1B5C&#39;][&#39;Humidity&#39;] &gt; 0 %} {{ value_json[&#39;ZbReceived&#39;][&#39;0x1B5C&#39;][&#39;Humidity&#39;] }} {% else %} {{ states(entity_id) }} {% endif %} availability_topic: &#34;tele/tasmota_01/LWT&#34; payload_available: &#34;Online&#34; payload_not_available: &#34;Offline&#34; qos: 0 device_class: &#34;humidity&#34; expire_after: 86400 unit_of_measurement: &#39;%&#39; </code></pre><p>I got stuck working on the buttons and the human presence sensor, and in researching it I kept finding all of these articles about it &ldquo;just working&rdquo;.</p> <p>I finally <a class="link" href="https://github.com/arendst/Tasmota/discussions/24826#discussioncomment-17227555" target="_blank" rel="noopener" >posted a message</a> to the Tasmota discussion forum on GitHub and a person named <a class="link" href="https://github.com/sfromis" target="_blank" rel="noopener" >sfromis</a> pointed me in the right direction.</p> <p>This doesn&rsquo;t mean that doing all of this extra effort wouldn&rsquo;t work, but there was a much easier solution.</p> <h2 id="using-zigbee-home-automation">Using ZigBee Home Automation </h2><p>The trick is to use the <a class="link" href="https://www.home-assistant.io/integrations/zha/" target="_blank" rel="noopener" >ZigBee Home Automation</a> (ZHA) integration in HA.</p> <p>Go back to the Tasmota interface and click on &ldquo;Configuration&rdquo; and then &ldquo;Auto-Conf&rdquo;. My guess is that you will be running the &ldquo;Sonoff ZBPro&rdquo; configuration. Select a new auto-configuration from the drop down labeled &ldquo;Sonoff ZBPro TCP&rdquo;. Apply it and the device should restart.</p> <p><img alt="Tasmota Configuration Screen Showing TCP option" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-TCP-config.png"></p> <p>This will put the Sonoff Bridge into a mode where it can be controlled over the network directly from ZHA. And that&rsquo;s it - you&rsquo;re done messing with Tasmota.</p> <p>In the HA user interface, go to Settings and then Integrations. Search for and add &ldquo;Zigbee Home Automation&rdquo;. When it is installed, configure it and choose to manually add the serial port. Enter in <code>socket://[Tasmota IP Address]:8888</code> and the it should connect and complete the setup. Here is an <a class="link" href="https://dialedin.com.au/blog/sonoff-zbbridge-p-setup" target="_blank" rel="noopener" >older post</a> with more information.</p> <p>You can then navigate to &ldquo;Settings&rdquo; then &ldquo;Zigbee&rdquo; and choose &ldquo;Add Device&rdquo;. This will bring up pairing mode so you can press the pairing button on your Zigbee device and, bam, it will be added.</p> <p>Easy peasy.</p> <h2 id="final-reflections">Final Reflections </h2><p>After spending several days on this, I still haven&rsquo;t configured the buttons that started me on this journey. I verified that they worked but I want to progress more in my journey from HomeKit to Home Assistant before putting them in front of my Dad (for now, he carries a whistle).</p> <p><img alt="Home Assistant Screenshot showing Zigbee devices" loading="lazy" sizes="(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px" src="https://www.adventuresinoss.com/images/ZHA-HA-sensor.png"></p> <p>But the devices I do have configured work fine. I can read the temperature and humidity in his apartment (he likes it warm), and I can tell if he is at his desk or in bed, without using cameras.</p> <p>It might have been easier to have simply bought a Zigbee USB dongle and plugged it right in to the <a class="link" href="https://en.wikipedia.org/wiki/Raspberry_Pi" target="_blank" rel="noopener" >Raspberry Pi</a> running HA, but those have limited range. Now that I understand how it all works, I&rsquo;ll probably buy some more Zigbee bridges and devices and put them around the farm (say, in the barn). Being able to use the Bridge over WiFi will make that possible.</p> <p>Many thanks to the folks who went before me, and I hope that others find this useful in their own Zigbee journey.</p>'
